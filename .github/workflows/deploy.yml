name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/okestraai/affinityecho-backend

jobs:
  # ─── CI GATE ──────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint
        continue-on-error: true

      - run: npm run test:cov

      - run: npm audit --audit-level=high
        continue-on-error: true

  # ─── BUILD & PUSH TO GHCR ────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on pushed image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:production
          format: table
          exit-code: 0
          severity: CRITICAL

  # ─── DEPLOY PRODUCTION ────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, affinityecho-deploy]
    needs: build-and-push
    environment:
      name: production
      url: https://api.affinityecho.com
    steps:
      - name: Ensure vLLM env vars in production .env
        working-directory: /home/okestraailabs/affinityecho/production
        run: |
          if ! grep -q "VLLM_CHAT_URL" .env.production 2>/dev/null; then
            printf '\n# ── vLLM (Okestra AI Insights — direct call) ─────────────\nVLLM_CHAT_URL=https://chat.affinityecho.com\nCF_ACCESS_CLIENT_ID=c83bd82878c8a1937d64ba223324b615.access\nCF_ACCESS_CLIENT_SECRET=d71737956553bccdb12403d5512b8b87a9244815fc9685bd5efe970f3138f9dd\n' >> .env.production
            echo "Added vLLM env vars to .env.production"
          else
            echo "vLLM env vars already present in .env.production"
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest production image
        run: docker pull ${{ env.IMAGE_NAME }}:production

      - name: Record rollback tag
        working-directory: /home/okestraailabs/affinityecho/production
        run: |
          CURRENT_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:production 2>/dev/null || echo "none")
          echo "$CURRENT_DIGEST" > .last-good-backend-digest

      - name: Deploy production stack
        working-directory: /home/okestraailabs/affinityecho/production
        run: |
          docker compose --env-file .env.production -f docker-compose.yml -p affinityecho-production up -d --no-build api redis cloudflared
          echo "Waiting for API healthcheck..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' affinityecho-production-api 2>/dev/null | grep -q healthy; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: API did not become healthy within 150s"
          docker logs affinityecho-production-api --tail 50
          exit 1
