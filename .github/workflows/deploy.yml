name: Deploy

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/okestraai/affinityecho-backend

jobs:
  # ─── CI GATE ──────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run test:cov

      - run: npm audit --audit-level=high

  # ─── BUILD & PUSH TO GHCR ────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine environment tag
        id: env-tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.env-tag.outputs.tag }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.tag }}
          format: table
          exit-code: 0
          severity: CRITICAL

  # ─── DEPLOY STAGING ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    if: github.ref_name == 'develop'
    runs-on: [self-hosted, affinityecho-deploy]
    needs: build-and-push
    environment:
      name: staging
      url: https://staging-api.affinityecho.com
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest staging image
        run: docker pull ${{ env.IMAGE_NAME }}:staging

      - name: Deploy staging stack
        working-directory: /home/okestraailabs/affinityecho/staging
        run: |
          docker compose -f docker-compose.staging.yml -p affinityecho-staging up -d --no-build api
          echo "Waiting for API healthcheck..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' affinityecho-staging-api 2>/dev/null | grep -q healthy; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: API did not become healthy within 150s"
          docker logs affinityecho-staging-api --tail 50
          exit 1

  # ─── DEPLOY PRODUCTION ────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: github.ref_name == 'main'
    runs-on: [self-hosted, affinityecho-deploy]
    needs: build-and-push
    environment:
      name: production
      url: https://api.affinityecho.com
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest production image
        run: docker pull ${{ env.IMAGE_NAME }}:production

      - name: Record rollback tag
        working-directory: /home/okestraailabs/affinityecho/production
        run: |
          CURRENT_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:production 2>/dev/null || echo "none")
          echo "$CURRENT_DIGEST" > .last-good-backend-digest

      - name: Deploy production stack
        working-directory: /home/okestraailabs/affinityecho/production
        run: |
          docker compose -f docker-compose.yml -p affinityecho-production up -d --no-build api
          echo "Waiting for API healthcheck..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' affinityecho-production-api 2>/dev/null | grep -q healthy; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: API did not become healthy within 150s"
          docker logs affinityecho-production-api --tail 50
          exit 1
